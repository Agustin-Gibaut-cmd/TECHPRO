services:
  db:
    image: postgres:16-alpine
    container_name: techpro-db
    restart: unless-stopped
    env_file:
      - ./server/.env
    entrypoint: ["sh", "-c"]
    command:
      - |
        export POSTGRES_DB="$$DB_NAME"
        export POSTGRES_USER="$$DB_USER"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DB_USER\" -d \"$$DB_NAME\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: techpro-backend
    container_name: techpro-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      DB_CONN_MAX_AGE: "60"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
